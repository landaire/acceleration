[package]
name = "shadowboot"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Lander Brandt"]
description = "Xbox 360 devkit shadowboot image compiler"
repository = "https://github.com/landaire/acceleration"
readme = "README.md"
keywords = ["xbox360", "shadowboot", "xbox", "cli"]
categories = ["command-line-utilities"]

[features]
dhat = ["dep:dhat"]

[dependencies]
xflash = { version = "0.2", path = "../xflash", default-features = false }
lzxc = { version = "0.2", path = "../lzxc" }
lzxd = "0.2"
sha-1 = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
memmap2 = "0.9.9"
same-file = "1.0.6"
tempfile = "3.23.0"
dhat = { version = "0.3.3", optional = true }
