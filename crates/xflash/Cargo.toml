[package]
name = "xflash"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
license-file = "../LICENSE"
authors = ["Lander Brandt"]
description = "Command-line inspector for Xbox 360 devkit flash images"
repository = "https://github.com/landaire/acceleration"
readme = "README.md"
keywords = ["xbox360", "flash", "xbox", "cli"]
categories = ["command-line-utilities"]
include = ["src/**", "README.md"]

[features]
dhat = ["dep:dhat"]

[dependencies]
sfcx = { version = "0.4", path = "../sfcx", features = ["clap"] }
thiserror = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
anstream = "1.0"
anstyle = "1.0"
memmap2 = "0.9.9"
rootcause = "0.12"
same-file = "1.0.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dhat = { version = "0.3.3", optional = true }

[[bin]]
name = "xflash"
path = "src/main.rs"
