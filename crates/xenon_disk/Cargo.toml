[package]
name = "xenon_disk"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
license-file = "../LICENSE"
authors = ["Lander Brandt"]
description = "Sans-io partition layouts, devkit partition tables and device detection for Xbox 360 disks and memory units"
repository = "https://github.com/landaire/acceleration"
keywords = ["xbox360", "xbox", "partition", "sans-io", "parser"]
categories = ["parser-implementations", "filesystem"]
include = ["src/**"]

[dependencies]
fskit = { workspace = true }
sha-1 = { workspace = true }
thiserror = { workspace = true }
xecrypt = { version = "0.4", path = "../xecrypt" }
xenon_io = { version = "0.4", path = "../xenon_io" }
xenon_types = { version = "0.4", path = "../xenon_types" }

[dev-dependencies]
futures = { workspace = true }
insta = { workspace = true }
rsa = "0.9.10"

[package.metadata.docs.rs]
all-features = true
