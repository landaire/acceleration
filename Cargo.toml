[workspace]
resolver = "2"
members = [
	"crates/cli",
	"crates/lzxc",
	"crates/stfs",
	"crates/system_update",
	"crates/shadowboot",
	"crates/ui",
	"crates/xcontent",
	"crates/xecrypt",
	"crates/xex2",
	"crates/xflash",
	"crates/xex2-ffi",
	"crates/xex2ool",
	"crates/xenon_lzx",
	"crates/xenon_types",
	"third-party/rust",
]

[workspace.package]
# Shared version for the published crates except `lzxc`, which is released
# independently.
version = "0.4.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
byteorder = "1.5"
num_enum = "0.7"
bitflags = "2.11"
sha-1 = "0.10.1"
vfs = "0.13"
anyhow = "1.0"
futures = "0.3"
async-trait = "0.1"
base64 = "0.22"
insta = { version = "1", features = ["toml"] }
fskit = { version = "0.2", features = ["vfs"] }
jiff = "0.2"
suture = { version = "0.3.0", features = ["serde"] }
