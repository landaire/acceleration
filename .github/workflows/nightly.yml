name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

# Publishes the archives of the default branch as a pre-release when the
# branch has moved since the last nightly. Each nightly has its own tag,
# `nightly-YYYY-MM-DD-COMMIT`, and is never replaced, so its download URLs
# and DotSlash files stay valid.

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      head: ${{ steps.compare.outputs.head }}
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      - name: Compare the default branch with the published nightlies
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A manual run from another branch still builds the default branch.
          branch=$(gh api "repos/$GH_REPO" --jq .default_branch)
          head=$(gh api "repos/$GH_REPO/commits/$branch" --jq .sha)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$(date -u +%Y-%m-%d)-${head:0:12}" >> "$GITHUB_OUTPUT"
          published=$(gh api "repos/$GH_REPO/git/matching-refs/tags/nightly-" \
            --jq "[.[] | select(.object.sha == \"$head\")] | length")
          if [ "$published" -gt 0 ]; then
            echo "A nightly of $head is already published."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build-executables.yml
    with:
      version: ${{ needs.check.outputs.tag }}
      ref: ${{ needs.check.outputs.head }}
    secrets: inherit

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ needs.check.outputs.head }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --prerelease \
            --latest=false \
            --target "$HEAD" \
            --title "Nightly ${TAG#nightly-}" \
            --notes "Built from $HEAD. Nightly builds are not versioned releases."

      - uses: facebook/dotslash-publish-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          config: .github/dotslash-config.json
          tag: ${{ needs.check.outputs.tag }}
