name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A `vX.Y.Z` tag publishes a GitHub release with the archives that
# build-executables.yml builds from the tagged commit. The tag must name the
# workspace version in Cargo.toml.

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag names the workspace version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not name the workspace version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build-executables.yml
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ github.sha }}
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
