name: CI

on:
  push:
    branches: [main]
  pull_request:

# Buck2 builds, tests and lints everything, including benchmarks, examples,
# and the `-all-features` variants of the crates with optional features.
# Cargo only resolves the workspace for reindeer and
# build_defs/update_buck_files.py.
#
# Every platform runs Buck2 through bin/buck2, which fetches the release
# that toolchains/buck2 pins with DotSlash. On Linux and macOS, devenv
# provides reindeer, Cargo and Python, and Cachix holds the Nix store
# paths. Windows has no Nix, so it runs bootstrap.ps1.
#
# Pushes to main read and write the shared action cache of
# landaire/build-cache (ci/configure-action-cache.sh). Pull requests only
# read it.

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      # Report every platform instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            checks: true
          - name: macOS arm64
            os: macos-15
            checks: false
    runs-on: ${{ matrix.os }}
    # Joining the tailnet to reach the action cache.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # A clean Buck2 build of //crates/... does not fit in the free space of
      # the Linux runner image. Remove preinstalled SDKs the build never uses.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: landaire-gh-public
          extraPullNames: devenv
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Select the cached execution platform
        run: ci/configure-action-cache.sh

      - uses: landaire/build-cache/.github/actions/buck-cache@8ebcdd82280718d26191a9f5d81fdc88be66dcb3
        with:
          client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          pr-client-id: ${{ vars.TS_PR_CLIENT_ID }}
          pr-audience: ${{ vars.TS_PR_AUDIENCE }}

      - name: Check the generated files
        if: matrix.checks
        run: |
          devenv shell -- python3 toolchains/update_rust_release.py --check
          devenv shell -- python3 build_defs/update_buck_files.py
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Build
        run: devenv shell -- buck2 build //crates/...

      - name: Test
        run: devenv shell -- buck2 test //crates/...

      - name: Check formatting and clippy diagnostics
        if: matrix.checks
        run: devenv shell -- python3 build_defs/lint.py

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy the checkout to a short path
        shell: pwsh
        run: ./ci/prepare-windows-runner.ps1 -Source $env:GITHUB_WORKSPACE -Destination C:\a

      - name: Install DotSlash and Buck2
        shell: pwsh
        working-directory: C:\a
        run: |
          ./bootstrap.ps1
          Add-Content -Path $env:GITHUB_PATH -Value C:\a\bin

      - name: Select the cached execution platform
        shell: bash
        working-directory: C:\a
        run: sh ci/configure-action-cache.sh

      - uses: landaire/build-cache/.github/actions/buck-cache@8ebcdd82280718d26191a9f5d81fdc88be66dcb3
        with:
          client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          pr-client-id: ${{ vars.TS_PR_CLIENT_ID }}
          pr-audience: ${{ vars.TS_PR_AUDIENCE }}
          buckconfig: C:/a/.buckconfig.local

      - name: Build
        working-directory: C:\a
        run: buck2 build //crates/...

      - name: Test
        working-directory: C:\a
        run: buck2 test //crates/...
